name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Standalone binary starts
        run: bun build --compile --minify src/index.ts --outfile bin/spaicely && bin/spaicely --version
